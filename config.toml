# Codex config.toml — Aida Labs (api.lsidestudio.com) via CC Switch
# 在 CC Switch 添加 Codex 供应商时，把本文件内容粘贴到 config.toml 编辑框，
# 只需替换 <YOUR_API_KEY> 为你的密钥。
# cc-switch deeplink 一键导入产出的是官方固定模板（key 进 auth.json），
# 本模板走 config.toml 内 experimental_bearer_token，二者取一即可。

model = "SWE-2"
model_provider = "aidalabs"
wire_api = "responses"
model_reasoning_effort = "medium"
model_reasoning_summary = "auto"
model_verbosity = "high"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
disable_response_storage = true
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[model_providers.aidalabs]
name = "Aida Labs"
base_url = "https://api.lsidestudio.com/v1"
model_catalog_url = "https://api.lsidestudio.com/v1/models"
wire_api = "responses"
requires_openai_auth = true
experimental_bearer_token = "<YOUR_API_KEY>"

[features]
api_key_model_discovery = true
